server {
    listen 80;
    server_name _; # Bármilyen bejövő kérést elfogad (pl. IP alapján is)

    # 1. Frontend kiszolgálása (React/Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Single Page App (SPA) esetén ez kötelező, hogy az útvonalválasztás (routing) működjön:
        try_files $uri $uri/ /index.html;
    }

    # 2. Backend API proxy
    # Feltételezem, hogy a backend végpontjaid pl. /api -val kezdődnek. 
    # Ha mással, írd át az "/api/" részt!
    location /api/ {
        proxy_pass http://backend:3001; # A docker-compose 'backend' szervizére mutat
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Opcionális: a kliens eredeti IP címének továbbítása
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}