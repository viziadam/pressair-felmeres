version: "3.3"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: yourapp-web
    container_name: yourapp-web
    depends_on:
      - backend
    ports:
      - "0.0.0.0:8087:443"    
    volumes:
      - ./server/src/offline/assets:/opt/assets:ro
      - ./certs:/etc/nginx/certs:ro
    restart: unless-stopped
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: yourapp-backend
    container_name: yourapp-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      # DB_URL: ...
      # JWT_SECRET: ...
    expose:
      - "3001"
    volumes:                    
      - ./server/data:/app/server/data   
    restart: unless-stopped